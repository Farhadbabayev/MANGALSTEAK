{{> page-hero}}

      <!--
        - #NECƏ İŞLƏYİR
      -->

      <section class="section section-steps" aria-labelledby="steps-title">
        <div class="wrap steps-grid">

          <div class="section-intro reveal">
            <h2 class="display-2" id="steps-title">Necə işləyir?</h2>
            <p class="lede">{{pages.rezervasiya.lead}}</p>
          </div>

          <ol class="steps reveal">
            {{blocks.stepCards}}
          </ol>

        </div>
      </section>


{{> reservation}}


      <!--
        - #QAYDALAR
      -->

      <section class="section" aria-labelledby="rules-title">
        <div class="wrap rules-grid reveal">

          <div>
            <h2 class="display-2" id="rules-title">Rezervasiya qaydaları</h2>

            <ul class="rules-list">
              {{blocks.ruleItems}}
            </ul>
          </div>

          <div class="call-card">
            <p class="dim">Qrup sifarişləri üçün</p>
            <a href="tel:{{contact.phoneHref}}" class="call-number">{{contact.phone}}</a>
            <p class="dim small">{{hours.short}}</p>
          </div>

        </div>
      </section>


      <!--
        - #XƏRİTƏ
      -->

      <div class="map-frame">
        <iframe src="{{contact.mapEmbed}}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          title="{{site.name}} xəritədə" allowfullscreen></iframe>
      </div>
