{{> page-hero}}

      <!--
        - #NECƏ İŞLƏYİR
      -->

      <section class="section" aria-label="Rezervasiya mərhələləri">
        <div class="wrap">

          <div class="section-head text-center reveal">
            <p class="label">{{pages.rezervasiya.subtitle}}</p>
            <h2 class="display-2">Necə işləyir?</h2>
            <p class="lede">{{pages.rezervasiya.lead}}</p>
          </div>

          <ul class="steps reveal">
            {{blocks.stepCards}}
          </ul>

        </div>
      </section>


{{> reservation}}


      <!--
        - #QAYDALAR
      -->

      <section class="section" aria-label="Rezervasiya qaydaları">
        <div class="wrap split reveal">

          <div class="split-body">
            <div class="index-head">
              <span class="num">№ 04</span>
              <span class="label">Bilməli olduqlarınız</span>
            </div>

            <h2 class="title-1">Rezervasiya qaydaları</h2>

            <ul class="rules-list">
              {{blocks.ruleItems}}
            </ul>

            <p class="label">Qrup sifarişləri üçün</p>
            <p style="font-family:var(--display);font-size:28px;color:var(--gold);margin-top:8px">
              <a href="tel:{{contact.phoneHref}}">{{contact.phone}}</a>
            </p>
          </div>

          <div class="split-img">
            <img src="./assets/images/event-1.jpg" width="570" height="620" loading="lazy"
              alt="{{site.name}} salonu">
          </div>

        </div>
      </section>


      <!--
        - #XƏRİTƏ
      -->

      <div class="map-frame">
        <iframe src="{{contact.mapEmbed}}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
          title="{{site.name}} xəritədə" allowfullscreen></iframe>
      </div>
