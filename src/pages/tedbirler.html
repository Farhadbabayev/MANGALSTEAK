{{> page-hero}}

      <!--
        - #PAKETLƏR
      -->

      <section class="section packages" aria-label="banket paketləri">
        <div class="container">

          <p class="section-subtitle text-center label-2">{{pages.tedbirler.subtitle}}</p>
          <h2 class="headline-1 section-title text-center">{{pages.tedbirler.title}}</h2>
          <p class="section-text text-center">{{pages.tedbirler.lead}}</p>

          <ul class="package-list">
            {{blocks.packageCards}}
          </ul>

          <p class="menu-text text-center">
            Paketlər fərdi şəkildə uyğunlaşdırıla bilər — bizə zəng edin:
            <a href="tel:{{contact.phoneHref}}" class="link">{{contact.phone}}</a>
          </p>

          <img src="./assets/images/shape-5.png" width="921" height="1036" loading="lazy" alt=""
            class="shape shape-2 move-anim">

        </div>
      </section>


      <!--
        - #TƏDBİRLƏR
      -->

      <section class="section event bg-black-10" aria-label="tədbirlər">
        <div class="container">

          <p class="section-subtitle label-2 text-center">{{events.subtitle}}</p>
          <h2 class="section-title headline-1 text-center">{{events.title}}</h2>

          <ul class="grid-list">
            {{blocks.eventCards}}
          </ul>

        </div>
      </section>


{{> reservation}}
