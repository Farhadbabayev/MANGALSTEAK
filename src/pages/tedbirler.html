{{> page-hero}}

      <!--
        - #PAKETLƏR
      -->

      <section class="section" aria-label="Banket paketləri">
        <div class="wrap">

          <div class="section-head text-center reveal">
            <p class="label">{{pages.tedbirler.subtitle}}</p>
            <h2 class="display-2">{{pages.tedbirler.title}}</h2>
            <p class="lede">{{pages.tedbirler.lead}}</p>
          </div>

          <ul class="package-grid reveal">
            {{blocks.packageCards}}
          </ul>

          <p class="menu-note">
            Paketlər fərdi şəkildə uyğunlaşdırıla bilər —
            <a href="tel:{{contact.phoneHref}}" class="span">{{contact.phone}}</a>
          </p>

        </div>
      </section>


      <!--
        - #TƏDBİRLƏR
      -->

      <section class="section bg-2" aria-label="Yaxınlaşan tədbirlər">
        <div class="wrap">

          <div class="section-head text-center reveal">
            <p class="label">{{events.subtitle}}</p>
            <h2 class="display-2">{{events.title}}</h2>
          </div>

          <ul class="card-grid reveal">
            {{blocks.eventCards}}
          </ul>

        </div>
      </section>


{{> reservation}}
