{{> page-hero}}

      <!--
        - #QALEREYA
      -->

      <section class="section" aria-labelledby="gallery-title">
        <div class="wrap">

          <div class="section-intro reveal">
            <h2 class="display-2" id="gallery-title">{{gallery.title}}</h2>
            <p class="lede">{{gallery.text}}</p>
          </div>

          <ul class="gallery-grid reveal">
            {{blocks.galleryItems}}
          </ul>

        </div>
      </section>


      <!--
        - #RƏY
      -->

      <section class="band" aria-label="{{t.common.guestReview}}">
        <div class="band-bg">
          <img src="./assets/images/testimonial-bg.jpg" width="1880" height="900" loading="lazy" alt="">
        </div>

        <div class="wrap">
          <blockquote>
            <p>{{testimonial.text}}</p>
            <cite>{{testimonial.author}}</cite>
          </blockquote>
        </div>
      </section>
