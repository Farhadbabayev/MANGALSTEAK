{{> page-hero}}

      <!--
        - #QALEREYA
      -->

      <section class="section" aria-label="Qalereya">
        <div class="wrap">

          <div class="section-head text-center reveal">
            <p class="label">{{gallery.subtitle}}</p>
            <h2 class="display-2">{{gallery.title}}</h2>
            <p class="lede">{{gallery.text}}</p>
          </div>

          <ul class="gallery-grid reveal">
            {{blocks.galleryItems}}
          </ul>

        </div>
      </section>


      <!--
        - #RƏY
      -->

      <section class="band" aria-label="Müştəri rəyi">
        <div class="band-bg">
          <img src="./assets/images/testimonial-bg.jpg" width="1880" height="900" loading="lazy" alt="">
        </div>

        <div class="wrap">
          <blockquote>{{testimonial.text}}</blockquote>
          <cite>{{testimonial.author}}</cite>
        </div>
      </section>


{{> reservation}}
