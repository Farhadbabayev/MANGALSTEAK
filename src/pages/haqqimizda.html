{{> page-hero}}

      <!--
        - #HEKAYƏ
      -->

      <section class="section story" aria-labelledby="story-title">
        <div class="wrap story-grid">

          <div class="story-body reveal">
            <h2 class="display-2" id="story-title">{{about.title}}</h2>
            <p class="lede">{{pages.haqqimizda.lead}}</p>
            <p>{{about.text}}</p>
          </div>

          <div class="story-media reveal">
            <figure class="story-img frame">
            <img src="./assets/images/about-banner.jpg" width="570" height="620" loading="lazy"
              alt="{{site.name}} mətbəxi">
          </figure>
          </div>

        </div>
      </section>


      <!--
        - #RƏQƏMLƏR
      -->

      <section class="stats-band" aria-label="Rəqəmlərlə biz">
        <div class="wrap">
          <ul class="stats reveal">
            {{blocks.statCards}}
          </ul>
        </div>
      </section>


      <!--
        - #QAYDALAR
      -->

      <section class="section" aria-labelledby="rules-title">
        <div class="wrap">

          <h2 class="display-2 section-title reveal" id="rules-title">Mətbəximizin üç qaydası</h2>

          <ol class="story-list reveal">
            {{blocks.storyBlocks}}
          </ol>

        </div>
      </section>


      <!--
        - #ÜSTÜNLÜKLƏR
      -->

      <section class="section section-alt" aria-labelledby="virtue-title">
        <div class="wrap virtues">

          <div class="virtues-head reveal">
            <h2 class="display-2" id="virtue-title">{{features.title}}</h2>
            <p class="manifest">{{services.text}}</p>
          </div>

          <ul class="virtue-grid reveal">
            {{blocks.featureCards}}
          </ul>

        </div>
      </section>
