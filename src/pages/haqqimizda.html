{{> page-hero}}

      <!--
        - #HEKAYƏ
      -->

      <section class="section" aria-label="Haqqımızda">
        <div class="wrap split reveal">

          <div class="split-body">
            <div class="index-head">
              <span class="num">№ 01</span>
              <span class="label">{{about.subtitle}}</span>
            </div>

            <h2 class="title-1">{{about.title}}</h2>

            <p>{{pages.haqqimizda.lead}}</p>
            <p>{{about.text}}</p>

            <a href="rezervasiya.html" class="btn">Masa ayır</a>
          </div>

          <div class="split-img">
            <img src="./assets/images/about-banner.jpg" width="570" height="620" loading="lazy"
              alt="{{site.name}} mətbəxi">
          </div>

        </div>
      </section>


      <!--
        - #RƏQƏMLƏR
      -->

      <section class="section-tight" aria-label="Rəqəmlərlə biz">
        <div class="wrap">
          <ul class="stats reveal">
            {{blocks.statCards}}
          </ul>
        </div>
      </section>


      <!--
        - #QAYDALAR
      -->

      <section class="section" aria-label="Necə işləyirik">
        <div class="wrap">

          <div class="section-head reveal">
            <div class="index-head">
              <span class="num">№ 02</span>
              <span class="label">Necə işləyirik</span>
            </div>
            <h2 class="display-2">Mətbəximizin üç qaydası</h2>
          </div>

          <ul class="story-list reveal">
            {{blocks.storyBlocks}}
          </ul>

        </div>
      </section>


      <!--
        - #ÜSTÜNLÜKLƏR
      -->

      <section class="section bg-2 text-center" aria-label="Üstünlüklər">
        <div class="wrap">

          <div class="section-head text-center reveal">
            <p class="label">{{features.subtitle}}</p>
            <h2 class="display-2">{{features.title}}</h2>
          </div>

          <ul class="grid-hair cols-4 reveal">
            {{blocks.featureCards}}
          </ul>

        </div>
      </section>
