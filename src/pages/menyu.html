{{> page-hero}}

      <!--
        - #TAM MENYU
      -->

      <section class="section" aria-label="Menyu">
        <div class="wrap">

          <nav class="menu-nav" aria-label="Menyu bölmələri">
            {{blocks.menuNav}}
          </nav>

          {{blocks.menuCategories}}

          <p class="menu-note">{{menu.note}}</p>
          <p class="menu-note">{{hours.kitchenNote}}</p>

          <div class="form-actions">
            <a href="rezervasiya.html" class="btn">Masa ayır</a>
          </div>

        </div>
      </section>


      <!--
        - #ŞEFİN SEÇİMİ
      -->

      <section class="section bg-2" aria-labelledby="dish-label">
        <div class="wrap split reveal">

          <div class="split-img">
            <img src="./assets/images/special-dish-banner.jpg" width="940" height="900" loading="lazy"
              alt="{{specialDish.title}}">
          </div>

          <div class="split-body">
            <div class="index-head">
              <span class="num">№ 01</span>
              <span class="label">{{specialDish.subtitle}}</span>
            </div>

            <h2 class="title-1" id="dish-label">{{specialDish.title}}</h2>

            <p>{{specialDish.text}}</p>

            <div class="price-row">
              <span class="now">{{specialDish.newPrice}}</span>
              <span class="was">{{specialDish.oldPrice}}</span>
            </div>

            <a href="rezervasiya.html" class="btn">Masa ayır</a>
          </div>

        </div>
      </section>


{{> reservation}}
