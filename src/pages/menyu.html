{{> page-hero}}

      <!--
        - #TAM MENYU
      -->

      <section class="section section-menu" aria-label="Menyu">
        <div class="wrap">

          <nav class="menu-nav" aria-label="Menyu bölmələri">
            {{blocks.menuNav}}
          </nav>

          <div class="menu-book">
            {{blocks.menuCategories}}
          </div>

          <div class="menu-foot">
            <p class="menu-note">{{menu.note}}</p>
            <p class="menu-note">{{hours.kitchenNote}}</p>
          </div>

        </div>
      </section>


      <!--
        - #ŞEFİN SEÇİMİ
      -->

      <section class="section dish" aria-labelledby="dish-label">
        <div class="wrap dish-grid">

          <figure class="dish-window reveal">
            <div class="window window-still">
              <div class="window-media">
                <img src="./assets/images/special-dish-banner.jpg" width="940" height="900" loading="lazy"
                  alt="{{specialDish.title}}">
              </div>
              {{blocks.dishLattice}}
            </div>
          </figure>

          <div class="dish-body reveal">
            <p class="label">{{specialDish.subtitle}}</p>
            <h2 class="display-2" id="dish-label">{{specialDish.title}}</h2>
            <p>{{specialDish.text}}</p>

            <div class="price-row">
              <span class="now">{{specialDish.newPrice}}</span>
              <s class="was">{{specialDish.oldPrice}}</s>
            </div>

            <a href="rezervasiya.html" class="btn btn-solid" data-rez-open>Masa ayır</a>
          </div>

        </div>
      </section>
