<!DOCTYPE html>
<html lang="{{lang.code}}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
{{page.robots}}  <link rel="canonical" href="{{site.url}}/{{page.path}}">
{{page.alternates}}
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{lang.locale}}">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{site.url}}/{{page.path}}">
  <meta property="og:image" content="{{site.url}}/assets/images/hero-slider-1.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="{{blocks.themeColor}}">

  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./favicon.svg">

  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="./assets/fonts/cormorant-garamond-300-normal-latin-ext.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="./assets/fonts/inter-300-normal-latin-ext.woff2">

  <script>document.documentElement.classList.add('js');</script>

  <link rel="stylesheet" href="./assets/css/fonts.css">
  <link rel="stylesheet" href="./assets/css/site.css">
  <link rel="stylesheet" href="./assets/css/theme.css">
{{page.extraCss}}
{{page.preload}}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Restaurant",
    "name": "{{site.name}}",
    "image": "{{site.url}}/assets/images/hero-slider-1.jpg",
    "url": "{{site.url}}",
    "telephone": "{{contact.phone}}",
    "email": "{{contact.email}}",
    "priceRange": "20-95 AZN",
    "servesCuisine": ["Steak House", "{{t.meta.cuisine}}", "Mangal"],
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{contact.addressShort}}",
      "addressLocality": "{{t.meta.city}}",
      "addressCountry": "AZ"
    },
    "acceptsReservations": "{{site.url}}/{{lang.prefix}}rezervasiya.html"
  }
  </script>
</head>

<body id="top">
