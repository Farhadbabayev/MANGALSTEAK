<!DOCTYPE html>
<html lang="{{site.lang}}">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{page.title}}</title>
  <meta name="title" content="{{page.title}}">
  <meta name="description" content="{{page.description}}">
  <link rel="canonical" href="{{site.url}}/{{page.file}}">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{site.locale}}">
  <meta property="og:site_name" content="{{site.name}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{site.url}}/{{page.file}}">
  <meta property="og:image" content="{{site.url}}/assets/images/hero-slider-1.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0e0f0f">

  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Forum&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/mangal.css">

{{page.preload}}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Restaurant",
    "name": "{{site.name}}",
    "image": "{{site.url}}/assets/images/hero-slider-1.jpg",
    "url": "{{site.url}}",
    "telephone": "{{contact.phone}}",
    "email": "{{contact.email}}",
    "priceRange": "₼₼",
    "servesCuisine": ["Steak House", "Azərbaycan mətbəxi", "Mangal"],
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "{{contact.addressShort}}",
      "addressLocality": "Bakı",
      "addressCountry": "AZ"
    },
    "acceptsReservations": "{{site.url}}/rezervasiya.html"
  }
  </script>
</head>

<body id="top">

  <div class="preload" data-preaload>
    <div class="circle"></div>
    <p class="text">{{site.shortName}}</p>
  </div>
