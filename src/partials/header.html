  <header class="header{{blocks.headerClass}}" data-header>
    <div class="wrap">

      {{> logo}}

      <nav class="navbar" data-navbar aria-label="{{t.nav.label}}">
        <ul class="navbar-list">
          <li><a href="index.html" class="navbar-link {{nav.index}}">{{t.nav.home}}</a></li>
          <li><a href="menyu.html" class="navbar-link {{nav.menyu}}">{{t.nav.menu}}</a></li>
          <li><a href="zallar.html" class="navbar-link {{nav.zallar}}">{{t.nav.halls}}</a></li>
          <li><a href="haqqimizda.html" class="navbar-link {{nav.haqqimizda}}">{{t.nav.about}}</a></li>
          <li><a href="qalereya.html" class="navbar-link {{nav.qalereya}}">{{t.nav.gallery}}</a></li>
          <li><a href="tedbirler.html" class="navbar-link {{nav.tedbirler}}">{{t.nav.events}}</a></li>
          <li><a href="elaqe.html" class="navbar-link {{nav.elaqe}}">{{t.nav.contact}}</a></li>
        </ul>

        <div class="navbar-foot">
          <a href="tel:{{contact.phoneHref}}">{{icons.phone}} {{contact.phone}}</a>
          <span>{{icons.clock}} {{hours.short}}</span>
          <ul class="lang-switch" aria-label="{{t.nav.language}}">{{lang.switcher}}</ul>
        </div>
      </nav>

      <ul class="lang-switch" aria-label="{{t.nav.language}}">{{lang.switcher}}</ul>

      <a href="rezervasiya.html" class="header-cta btn btn-solid" data-rez-open>{{t.common.reserve}}</a>

      <button class="nav-toggle" data-nav-toggler aria-label="{{t.nav.open}}" data-label-open="{{t.nav.open}}"
        data-label-close="{{t.nav.close}}" aria-expanded="false">
        <span></span><span></span>
      </button>

    </div>
  </header>

  <span class="sentinel sentinel-header" data-sentinel="header" aria-hidden="true"></span>
  <span class="sentinel sentinel-top" data-sentinel="top" aria-hidden="true"></span>
