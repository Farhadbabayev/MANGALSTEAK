  <!--
    - #REZERVASİYA PƏNCƏRƏSİ (üzən düymə ilə açılır)
  -->

  <div class="rez-modal" data-rez-modal>

    <div class="rez-modal-veil" data-rez-close></div>

    <div class="rez-modal-panel" role="dialog" aria-modal="true" aria-labelledby="rez-modal-basliq"
      data-reservation data-rez-panel>

      <div class="rez-modal-head">
        <h2 id="rez-modal-basliq">Masanızı ayırın</h2>

        <button type="button" class="rez-modal-close" data-rez-close aria-label="Pəncərəni bağla">
          {{icons.x}}
        </button>
      </div>

      <div class="rez-modal-body" data-rez-scroll>

        <form data-reservation-form novalidate>

          <div class="fields">

            <div class="field">
              <label for="rezm-name">Ad, Soyad</label>
              <input type="text" id="rezm-name" name="name" data-field="name" required maxlength="80"
                autocomplete="name" placeholder="Aysel Quliyeva">
            </div>

            <div class="field">
              <label for="rezm-phone">Telefon</label>
              <input type="tel" id="rezm-phone" name="phone" data-field="phone" required maxlength="25"
                autocomplete="tel" placeholder="+994 50 123 45 67">
            </div>

            <div class="field">
              <label for="rezm-date">Tarix</label>
              <input type="date" id="rezm-date" name="date" data-field="date" required>
            </div>

            <div class="field">
              <label for="rezm-time">Saat</label>
              <select id="rezm-time" name="time" data-field="time" required>
                {{blocks.timeOptions}}
              </select>
            </div>

            <div class="field">
              <label for="rezm-guests">Nəfər sayı</label>
              <select id="rezm-guests" name="guests" data-field="guests">
                {{blocks.guestOptions}}
              </select>
            </div>

            <div class="field">
              <label for="rezm-area">Zona</label>
              <select id="rezm-area" name="area" data-field="area">
                {{blocks.areaOptions}}
              </select>
            </div>

            <div class="field">
              <label for="rezm-occasion">Səbəb</label>
              <select id="rezm-occasion" name="occasion" data-field="occasion">
                {{blocks.occasionOptions}}
              </select>
            </div>

            <div class="field">
              <label for="rezm-note">Qeyd</label>
              <input type="text" id="rezm-note" name="note" data-field="note" maxlength="500"
                placeholder="Uşaq kreslosu, tort…">
            </div>

          </div>

          <div class="form-status" data-form-status role="status" aria-live="polite"></div>

          <p class="hp-field" aria-hidden="true">
            <label>Bu xananı boş buraxın
              <input type="text" name="website" tabindex="-1" autocomplete="off">
            </label>
          </p>

          <div class="form-actions">
            <button type="submit" class="btn btn-solid" data-submit-btn>Masanı ayır</button>
            <p class="rez-modal-note">Məlumatlarınız yalnız rezervasiyanın təsdiqi üçün istifadə olunur.</p>
          </div>

        </form>

        <div class="form-success" data-form-success hidden>

          <div class="success-mark" aria-hidden="true">
            {{icons.check}}
          </div>

          <h2 class="title-1">Rezervasiya qəbul olundu</h2>

          <p class="rez-modal-note">Heyətimiz qısa müddətdə sizinlə əlaqə saxlayacaq.</p>

          <div class="success-code">
            <span class="label">Rezervasiya kodunuz</span>
            <strong data-success-code></strong>
          </div>

          <ul class="success-list" data-success-summary></ul>

          <p class="rez-modal-note">
            Dəyişiklik və ya ləğv üçün:
            <a href="tel:{{contact.phoneHref}}">{{contact.phone}}</a>
          </p>

          <div class="form-actions">
            <button type="button" class="btn" data-new-reservation>Yeni rezervasiya</button>
          </div>

        </div>

      </div>

    </div>
  </div>
