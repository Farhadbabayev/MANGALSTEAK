  <!--
    - #REZERVASİYA PƏNCƏRƏSİ (üzən düymə ilə açılır)
  -->

  <div class="rez-modal" data-rez-modal>

    <div class="rez-modal-veil" data-rez-close></div>

    <div class="rez-modal-panel" role="dialog" aria-modal="true" aria-labelledby="rez-modal-basliq"
      data-reservation data-rez-panel>

      <div class="rez-modal-head">
        <h2 id="rez-modal-basliq">{{t.form.title}}</h2>

        <button type="button" class="rez-modal-close" data-rez-close aria-label="{{t.form.closeDialog}}">
          {{icons.x}}
        </button>
      </div>

      <div class="rez-modal-body" data-rez-scroll>

        <form data-reservation-form novalidate>

          <div class="fields">

            <div class="field">
              <label for="rezm-name">{{t.form.name}}</label>
              <input type="text" id="rezm-name" name="name" data-field="name" required maxlength="80"
                autocomplete="name" placeholder="{{t.form.namePlaceholder}}">
            </div>

            <div class="field">
              <label for="rezm-phone">{{t.form.phone}}</label>
              <input type="tel" id="rezm-phone" name="phone" data-field="phone" required maxlength="25"
                autocomplete="tel" placeholder="+994 50 123 45 67">
            </div>

            <div class="field">
              <label for="rezm-date">{{t.form.date}}</label>
              <input type="date" id="rezm-date" name="date" data-field="date" required>
            </div>

            <div class="field">
              <label for="rezm-time">{{t.form.time}}</label>
              <select id="rezm-time" name="time" data-field="time" required>
                {{blocks.timeOptions}}
              </select>
            </div>

            <div class="field">
              <label for="rezm-guests">{{t.form.guests}}</label>
              <select id="rezm-guests" name="guests" data-field="guests">
                {{blocks.guestOptions}}
              </select>
            </div>

            <div class="field">
              <label for="rezm-area">{{t.form.area}}</label>
              <select id="rezm-area" name="area" data-field="area">
                {{blocks.areaOptions}}
              </select>
            </div>

            <div class="field">
              <label for="rezm-occasion">{{t.form.occasion}}</label>
              <select id="rezm-occasion" name="occasion" data-field="occasion">
                {{blocks.occasionOptions}}
              </select>
            </div>

            <div class="field">
              <label for="rezm-note">{{t.form.note}}</label>
              <input type="text" id="rezm-note" name="note" data-field="note" maxlength="500"
                placeholder="{{t.form.notePlaceholderShort}}">
            </div>

          </div>

          <div class="form-status" data-form-status role="status" aria-live="polite"></div>

          <p class="hp-field" aria-hidden="true">
            <label>{{t.form.honeypot}}
              <input type="text" name="website" tabindex="-1" autocomplete="off">
            </label>
          </p>

          <div class="form-actions">
            <button type="submit" class="btn btn-solid" data-submit-btn>{{t.form.submit}}</button>
            <p class="rez-modal-note">{{t.form.privacy}}</p>
          </div>

        </form>

        <div class="form-success" data-form-success hidden>

          <div class="success-mark" aria-hidden="true">
            {{icons.check}}
          </div>

          <h2 class="title-1">{{t.form.successTitle}}</h2>

          <p class="rez-modal-note">{{t.form.successTextShort}}</p>

          <div class="success-code">
            <span class="label">{{t.form.codeLabel}}</span>
            <strong data-success-code></strong>
          </div>

          <ul class="success-list" data-success-summary></ul>

          <p class="rez-modal-note">
            {{t.form.changeCall}}
            <a href="tel:{{contact.phoneHref}}">{{contact.phone}}</a>
          </p>

          <div class="form-actions">
            <button type="button" class="btn" data-new-reservation>{{t.form.newReservation}}</button>
          </div>

        </div>

      </div>

    </div>
  </div>
