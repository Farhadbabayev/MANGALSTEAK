      <!--
        - #REZERVASİYA (daxili sistem)
      -->

      <section class="section booking" id="rezervasiya" aria-labelledby="rezervasiya-basliq" data-reservation>
        <div class="narrow">

          <div class="booking-head reveal">
            <h2 class="display-2" id="rezervasiya-basliq">{{t.form.title}}</h2>
            <p class="lede">{{t.form.lede}}</p>
          </div>

          <div class="carpet">
          <form data-reservation-form novalidate>

            <div class="fields">

              <div class="field">
                <label for="rez-name">{{t.form.name}}</label>
                <input type="text" id="rez-name" name="name" data-field="name" required maxlength="80"
                  autocomplete="name" placeholder="{{t.form.namePlaceholder}}">
              </div>

              <div class="field">
                <label for="rez-phone">{{t.form.phone}}</label>
                <input type="tel" id="rez-phone" name="phone" data-field="phone" required maxlength="25"
                  autocomplete="tel" placeholder="+994 50 123 45 67">
              </div>

              <div class="field">
                <label for="rez-date">{{t.form.date}}</label>
                <input type="date" id="rez-date" name="date" data-field="date" required>
              </div>

              <div class="field">
                <label for="rez-time">{{t.form.time}}</label>
                <select id="rez-time" name="time" data-field="time" required>
                  {{blocks.timeOptions}}
                </select>
              </div>

              <div class="field">
                <label for="rez-guests">{{t.form.guests}}</label>
                <select id="rez-guests" name="guests" data-field="guests">
                  {{blocks.guestOptions}}
                </select>
              </div>

              <div class="field">
                <label for="rez-area">{{t.form.area}}</label>
                <select id="rez-area" name="area" data-field="area">
                  {{blocks.areaOptions}}
                </select>
              </div>

              <div class="field">
                <label for="rez-occasion">{{t.form.occasion}}</label>
                <select id="rez-occasion" name="occasion" data-field="occasion">
                  {{blocks.occasionOptions}}
                </select>
              </div>

              <div class="field full">
                <label for="rez-note">{{t.form.note}}</label>
                <textarea id="rez-note" name="note" data-field="note" maxlength="500"
                  placeholder="{{t.form.notePlaceholder}}"></textarea>
              </div>

            </div>

            <p class="form-hint">
              {{icons.lock-simple}}
              {{t.form.privacy}}
            </p>

            <div class="form-status" data-form-status role="status" aria-live="polite"></div>

            <p class="hp-field" aria-hidden="true">
              <label>{{t.form.honeypot}}
                <input type="text" name="website" tabindex="-1" autocomplete="off">
              </label>
            </p>

            <div class="form-actions">
              <button type="submit" class="btn btn-solid" data-submit-btn>{{t.form.submit}}</button>
            </div>

          </form>

          <div class="form-success" data-form-success hidden>

            <div class="success-mark" aria-hidden="true">
              {{icons.check}}
            </div>

            <h2 class="display-2">{{t.form.successTitle}}</h2>

            <p class="lede">{{t.form.successText}}</p>

            <div class="success-code">
              <span class="label">{{t.form.codeLabel}}</span>
              <strong data-success-code></strong>
            </div>

            <ul class="success-list" data-success-summary></ul>

            <p class="dim small">
              {{t.form.changeCall}}
              <a href="tel:{{contact.phoneHref}}">{{contact.phone}}</a>
            </p>

            <div class="form-actions">
              <button type="button" class="btn" data-new-reservation>{{t.form.newReservation}}</button>
            </div>

          </div>
          </div>

        </div>
      </section>
